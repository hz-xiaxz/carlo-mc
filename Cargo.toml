[package]
name = "carlo-mc"
version = "0.1.0"
edition = "2021"
description = "A model-independent framework for deterministic, resumable Monte Carlo jobs"
repository = "https://github.com/hz-xiaxz/carlo-mc"
license = "MIT"
keywords = ["monte-carlo", "simulation", "checkpoint", "statistics", "reproducibility"]
categories = ["science", "simulation"]
readme = "README.md"
include = ["Cargo.toml", "README.md", "LICENSE", "src/lib.rs", "src/job.rs", "src/job/model.rs", "src/job/simulation.rs", "src/job/config.rs", "src/job/checkpoint.rs", "src/job/runner.rs", "src/job/results.rs", "src/job/paths.rs", "examples/*.rs"]

[dependencies]
hdf5-pure = "0.34.0"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
